<style>
.tw{opacity:.15;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}

.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ant{animation:ant 1.6s ease-in-out infinite}
@keyframes ant{0%,100%{opacity:.45}50%{opacity:1}}
.hl{animation:type .35s ease-in-out infinite alternate}
.hr{animation:type .35s ease-in-out infinite alternate-reverse}
@keyframes type{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.bit{opacity:0;animation:bit 3.5s linear infinite}
@keyframes bit{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(95px,-25px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
